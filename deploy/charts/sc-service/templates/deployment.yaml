apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "sc-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "sc-service.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sc-service.labels" . | nindent 8 }}
      annotations:
        checksum/env: {{ toJson .Values.env | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: "{{ .Values.image.registry }}/{{ .Values.image.name }}:{{ required "image.tag: <version>@sha256:<digest>, as the release manifest lists it" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: NO_COLOR
              value: "1"
            - name: SCBACKEND_DATA
              value: /data
            - name: SCBACKEND_POSTGRES
              value: {{ .Values.databases.postgres | quote }}
            - name: SCBACKEND_ARANGO
              value: {{ .Values.databases.arango | quote }}
            - name: SCBACKEND_HEALTH
              value: "0.0.0.0:{{ .Values.healthPort }}"
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            {{- range .Values.ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          secret:
            secretName: {{ .Values.dataSecret }}
