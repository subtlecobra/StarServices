{{- range .Values.shardClusters }}
---
apiVersion: scbackend.io/v1alpha1
kind: ShardCluster
metadata:
  name: {{ .name }}
spec:
  region: {{ .region }}
  image: "{{ $.Values.shardImage.registry }}/{{ $.Values.shardImage.name }}:{{ $.Values.shardImage.tag }}"
  build: {{ $.Values.build | quote }}
  publicAddress: {{ $.Values.publicAddress }}
  publicPortBase: {{ .publicPortBase }}
  nodePortBase: {{ .nodePortBase }}
  warmShards: {{ .warmShards }}
  maxShards: {{ .maxShards }}
  playersPerShard: {{ .playersPerShard }}
  scaleDownDelaySeconds: {{ .scaleDownDelaySeconds }}
  {{- with .shardTemplate }}
  shardTemplate: {{ . }}
  {{- end }}
{{- end }}
