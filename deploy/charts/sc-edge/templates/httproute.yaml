{{- range .Values.httpRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
spec:
  parentRefs:
    - name: sc-edge
      sectionName: https
  rules:
    - backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
      matches:
        {{- range .exactPaths }}
        - path:
            type: Exact
            value: {{ . | quote }}
        {{- end }}
        {{- range .pathPrefixes }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
{{- end }}
