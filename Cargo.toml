[workspace]
resolver = "2"
members = ["crates/*", "services/*", "tools/*"]
# The tools read the game archive on a workstation and never go into an image; `cargo build` alone builds the rest.
default-members = ["crates/*", "services/*"]

# Each component has its own version (semver), in its own Cargo.toml.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
hyper = { version = "1", features = ["client", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http2", "tokio"] }
prost = "0.14"
prost-types = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sc-api = { path = "crates/sc-api" }
sc-db = { path = "crates/sc-db" }
sc-oci = { path = "crates/sc-oci" }
sc-proto = { path = "crates/sc-proto" }
sc-runtime = { path = "crates/sc-runtime" }
sc-seed = { path = "crates/sc-seed" }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "gzip", "router", "server"] }
tracing = "0.1"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
