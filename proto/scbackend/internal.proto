// Calls between backend services. Nothing here is visible to the game client.
syntax = "proto3";
package scbackend.internal;

message PublishRequest {
  uint32 account_id = 1;
  string topic = 2;
  string type_name = 3;  // full protobuf type name of `value`
  bytes value = 4;
  // How long to wait for a subscriber to `topic` before publishing. 0 publishes at once.
  uint32 wait_for_subscriber_ms = 5;
}

message PublishResponse {
  uint32 delivered = 1;
}

service PushPublisher {
  // Reaches subscribers on every replica.
  rpc Publish(PublishRequest) returns (PublishResponse);
  // Reaches subscribers on this replica only. Replicas call it on each other.
  rpc PublishLocal(PublishRequest) returns (PublishResponse);
}

message AllocateShardRequest {
  string region = 1;
}

message AllocateShardResponse {
  string name = 1;
  string public_address = 2;
  uint32 public_port = 3;
}

// Answered by sc-shard-operator. An allocation reserves a player slot straight away, so capacity grows
// before the player has connected.
service ShardDirectory {
  rpc Allocate(AllocateShardRequest) returns (AllocateShardResponse);
}

import "sc/external/services/notifications/v1/types.proto";

// One notification for each of `notification.recipients`, whose `target_urn` is a player urn.
message CreateNotificationRequest {
  sc.external.services.notifications.v1.NotificationRequest notification = 1;
}

message CreateNotificationResponse {
  repeated string ids = 1;  // in the order of the recipients
}

// Answered by sc-notifications. It shares that service's port, so no GRPCRoute may list it: the
// gateway matches by service name, which is what keeps it away from the game client.
service NotificationsInternal {
  rpc Create(CreateNotificationRequest) returns (CreateNotificationResponse);
}

message DgsStatusRequest {}

// Frame times of the DGS's tick over its last full window, in 100 ns ticks, as the overlay's `DebugServerInfo` wants them.
message DgsFrames {
  int64 fastest = 1;
  int64 slowest = 2;
  int64 average = 3;
  int64 last = 4;
  uint32 hitches = 5;
}

message DgsStatusResponse {
  string shard_id = 1;
  string name = 2;
  string system = 3;
  repeated string roots = 4;
  uint64 governed_containers = 5;
  uint64 governed_entities = 6;
  DgsFrames frames = 7;
  // Players this DGS holds entities for.
  uint32 players = 8;
  // The entities of those players.
  uint64 player_entities = 9;
  // Its solar system, quantum grid and planets, which belong to no player.
  uint64 shard_entities = 10;
  // Differs after a restart, which loses what the DGS held. See `JoinPlayer`.
  uint64 boot_id = 11;
}

// A `QuatTS` with a scale of 1, relative to the entity's parent. A rotation of `0 0 0 1` is none.
message EntityTransform {
  double x = 1;
  double y = 2;
  double z = 3;
  double qx = 4;
  double qy = 5;
  double qz = 6;
  double qw = 7;
}

// One variable of a bind: see `Bind` in docs/PROTOCOL.md.
message EntitySnapshot {
  fixed32 key = 1;
  fixed32 type_id = 2;
  bytes value = 3;
}

// An entity as a DGS decides it. The replicant adds the batch and what the wire needs, and changes nothing here.
message EntityBind {
  fixed64 entity_id = 1;
  fixed32 class_crc = 2;
  uint32 flags = 3;
  EntityTransform transform = 4;
  fixed64 parent_id = 5;
  fixed32 parent_attach_id = 6;
  repeated fixed32 components = 7;
  repeated EntitySnapshot snapshots = 8;
}

message LocateHomeRequest {
  // Absent when the session names none, and the DGS picks the default.
  optional uint32 location_id = 1;
}

// What governs a home, for `SCBACKEND_DGS_AREAS` to turn into a DGS. A location without a hangar answers with where such
// a player goes instead.
message LocateHomeResponse {
  string system = 1;
  // The `name` of the planet's container. Empty for a place under no planet, which the `<system>system` root takes.
  string planet = 2;
}

message ShardEntitiesRequest {}

message ShardEntitiesResponse {
  // The game rules and the game mode, which all go first. Every DGS with a `<system>system` root builds the same ones, as
  // no system owns them.
  repeated EntityBind universe = 1;
  // Unset unless this DGS has the `<system>system` root.
  EntityBind solar_system = 2;
  EntityBind quantum_grid = 3;
  // Where this system goes among the others, as the client's bind order is not the template's.
  uint32 order = 4;
}

message JoinPlayerRequest {
  // Differs each time the replicant starts. A DGS frees what it held for an earlier value.
  uint64 replicant = 1;
  // One connection. A later session of the same account takes over its entities.
  uint64 session = 2;
  uint64 account_id = 3;
  optional uint32 location_id = 4;
}

message JoinPlayerResponse {
  // Unset for a location with no planet, or with the planet zone off. Goes in the solar systems' batch.
  EntityBind planet = 1;
  // Unset for a location with no hangar.
  EntityBind hangar = 2;
  EntityBind player = 3;
  DgsStatusResponse status = 4;
  // The containers inside the hangar, under it. Bound in a batch of their own, after the hangar's. Empty with no hangar.
  repeated EntityBind hangar_content = 5;
  // What the player wears: its body, head, clothes and items, each under the item whose port holds it (the body under the
  // player), parents first. The replicant binds them after the player's batch has ended, a batch per depth. See "Body and
  // loadout" in docs/PROTOCOL.md.
  repeated EntityBind player_items = 6;
}

message LeavePlayerRequest {
  uint64 replicant = 1;
  uint64 session = 2;
}

message LeavePlayerResponse {
  // Entities freed. 0 for a session the DGS does not hold, which is not an error.
  uint32 released = 1;
}

// A rotation as `x y z w`.
message Rotation {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

// One frame of the client's action stream (EntityRemoteMethod 7 on its player), with only what the replicant decodes.
// A frame without a button mask means no movement button is held. See "Player movement" in docs/PROTOCOL.md.
message InputFrame {
  // The client's time at the end of the frame, in 100 ns ticks.
  fixed64 time = 1;
  // `SMoveButtonMask`: 1 forward, 2 back, 4 left, 8 right.
  uint32 move_buttons = 2;
  bool sprint = 3;
  // `SDeltaRotation` (0x36): the view's aim at the start of the frame, `m_originAimRotation`, absolute in the zone's
  // frame. Unset when the view did not turn.
  Rotation aim_rotation = 4;
  // The frame held an action the replicant cannot read the length of, so what came after it is missing: the buttons
  // and sprint of a partial frame with none read are those of the frame before.
  bool partial = 5;
  // Jump actions in the frame: 1 start (0x9c), 2 `SJumpHold` (0x9d), 4 `SJumpRelease` (0x9e).
  uint32 jump = 6;
  // `SStance`: 1 stand, 2 crouch, 3 prone (inferred). Unset when the frame did not change it.
  optional uint32 stance = 7;
  // `SClientAuthoritativePosition` (0x32), sent while the player has `m_clientAuthoritative` set: where the client put
  // its actor at the end of the frame. Unset otherwise.
  ClientPosition client_position = 8;
}

// The end of a `SClientAuthoritativePosition`: the origin plus the delta, in the frame of the zone host it names.
message ClientPosition {
  fixed64 zone_host_id = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  // The base rotation at the end of the frame, `x y z w`.
  Rotation base_rotation = 5;
}

message PlayerInputRequest {
  uint64 replicant = 1;
  uint64 session = 2;
  // The player entity the frames are for.
  fixed64 entity_id = 3;
  // In the order the client sent them. May be empty, to read the state.
  repeated InputFrame frames = 4;
}

// The server's movement state of a player, in the frame of its zone host: what `SCActorStateDataSynced::SMovement`
// holds.
message PlayerMovement {
  fixed64 entity_id = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  Rotation base_rotation = 5;
  Rotation aim_rotation = 6;
  fixed64 zone_host_id = 7;
  fixed64 parent_id = 8;
  // Changes whenever anything above does.
  uint64 revision = 9;
  // The client's time at the end of the last input frame this state includes, in 100 ns ticks. 0 before the first.
  fixed64 frame_time = 10;
}

message PlayerInputResponse {
  PlayerMovement movement = 1;
}

// Answered by each sc-dgs pod, through its own Service of the shard's namespace. Only the replicant reaches it, by the
// namespace's NetworkPolicy. It has no GRPCRoute.
service DgsControl {
  rpc Status(DgsStatusRequest) returns (DgsStatusResponse);
  // Any DGS answers this, as every DGS has the table of home locations.
  rpc LocateHome(LocateHomeRequest) returns (LocateHomeResponse);
  // What this DGS owns that every client gets.
  rpc ShardEntities(ShardEntitiesRequest) returns (ShardEntitiesResponse);
  // Asked of the DGS that governs the player's home, which builds the player's entities and holds them. Calling it again
  // gives the same entities, and is how a replicant restores what a restarted DGS forgot. INVALID_ARGUMENT means this
  // account has no character, so there is no point in asking again. FAILED_PRECONDITION means another DGS governs it.
  rpc JoinPlayer(JoinPlayerRequest) returns (JoinPlayerResponse);
  // Frees a player's entities when its connection ends.
  rpc LeavePlayer(LeavePlayerRequest) returns (LeavePlayerResponse);
  // The client's input for a player this DGS holds, and the movement state it has led to. NOT_FOUND for a player it does
  // not hold.
  rpc PlayerInput(PlayerInputRequest) returns (PlayerInputResponse);
}

import "sc/external/common/types/v1/customization.proto";

message GetCustomizationRequest {
  uint64 geid = 1;  // the character
}

message GetCustomizationResponse {
  // As the client saved it. Unset when the character has saved none.
  sc.external.common.types.v1.CharacterCustomization customization = 1;
}

// Answered by sc-character-customizer, which owns saved characters. It shares that service's port, so no GRPCRoute may
// list it. A DGS asks it for a joining player's appearance.
service CharacterCustomizerInternal {
  rpc GetCustomization(GetCustomizationRequest) returns (GetCustomizationResponse);
}

message LoadAreaRequest {
  // As `system` in `containers`.
  string system = 1;
  // The names of the containers the DGS has authority over, with everything under them.
  repeated string roots = 2;
  // The roots of the other DGSs of the system, which the walk does not enter.
  repeated string excluded_roots = 3;
  // Put before the collection names, to read a test copy. Letters, digits and `_` only.
  string collection_prefix = 4;
}

// One container of an area. Its entities are the ids from `start_id`, `entities` of them.
message AreaContainer {
  fixed64 start_id = 1;
  uint64 entities = 2;
}

message LoadAreaResponse {
  repeated AreaContainer containers = 1;
}

message GetOwnersRequest {
  repeated fixed64 entities = 1;
}

message EntityOwner {
  fixed64 entity = 1;
  fixed64 owner = 2;
}

message GetOwnersResponse {
  // Entities that exist and have an owner, in no set order.
  repeated EntityOwner owners = 1;
}

// ---- Admin inventories (begin). Asked by sc-admin-web; answered by sc-entitygraph. See docs/INVENTORY.md. ----
// sc-entitygraph acts for the player `owner_id`: the checks a player's own command gets apply (an entity or inventory
// of another owner is refused), and so do capacity and loops. A mutation is applied once per `command_id` (sc-admin-web
// sends `admin:<request id>`): a repeat answers what the first did, with `replayed`. FAILED_PRECONDITION refuses an
// item that is live on a shard (unstowed, with a shard id), or an inventory held by one at any depth: the DGS has
// authority over it. sc-admin-web also refuses while the player is on a shard. INVALID_ARGUMENT names a bad field, NOT_FOUND a
// missing item or class.
import "sc/external/services/entitygraph/v1/types.proto";

message AdminInventoryTreeRequest {
  uint64 owner_id = 1;
  // Levels of containers below the player's own inventories. 0: no limit.
  uint32 max_depth = 2;
  // Items listed per inventory. 0: 500, at most 2000.
  uint32 max_items = 3;
}

message AdminInventoryItem {
  uint64 geid = 1;
  uint32 class_guid_crc = 2;
  string class_name = 3;  // empty when the class is not seeded
  uint32 stack_size = 4;
  uint64 owner_id = 5;
  string inventory_id = 6;                 // where it is stowed
  repeated string held_inventory_ids = 7;  // the inventories it holds: a crate's, a backpack's
  string class_guid = 8;
  string display_name = 9;  // the class's English name
  // Unstowed onto a shard, where the DGS has it: listed, but not changed.
  bool on_shard = 10;
  string shard_id = 11;
}

message AdminInventory {
  sc.external.services.entitygraph.v1.InventoryNodeProperties inventory = 1;
  // The nearest inventory up the holder chain: where its holder is stowed. Empty at the top.
  string parent_inventory_id = 2;
  repeated AdminInventoryItem items = 3;  // at most `max_items`, by GEID
  uint64 holder_id = 4;                   // the entity that holds it: the player, a crate, a cargo grid
  string holder_class_name = 5;
  uint32 item_count = 6;  // every item stowed in it, also those left out of `items`
  uint32 depth = 7;       // 0 at the top
  bool live = 8;          // an entity up its holder chain is on a shard: changes are refused
}

message AdminInventoryTreeResponse {
  repeated AdminInventory inventories = 1;  // parents before children
}

message AdminMoveItemRequest {
  string command_id = 1;
  uint64 owner_id = 2;
  uint64 geid = 3;
  string from_inventory_id = 4;  // where the item is
  string to_inventory_id = 5;    // a player inventory its id says the player owns is created on first use
  uint32 quantity = 6;           // 0 or the whole stack moves the item; less splits it into a new item
  string actor = 7;
  string reason = 8;
}

message AdminMoveItemResponse {
  uint64 moved_geid = 1;  // the item, or the new one a split made
  bool replayed = 2;
}

message AdminAddItemRequest {
  string command_id = 1;
  uint64 owner_id = 2;
  string inventory_id = 3;
  string entity_class_guid = 4;  // a seeded entity class
  uint32 stack_size = 5;         // 0 is 1
  string actor = 6;
  string reason = 7;
}

message AdminAddItemResponse {
  uint64 geid = 1;  // the same GEID for a repeated command id
  bool replayed = 2;
}

message AdminRemoveItemRequest {
  string command_id = 1;
  uint64 owner_id = 2;
  uint64 geid = 3;
  string actor = 4;
  string reason = 5;
}

message AdminRemoveItemResponse {
  bool removed = 1;
  uint32 erased = 2;  // entities erased: the item and everything it held
  bool replayed = 3;
}

message AdminSearchEntityClassesRequest {
  // Part of a class name or of an English name, case ignored, or a GUID.
  string query = 1;
  uint32 limit = 2;  // 50 when 0, at most 200
}

message AdminEntityClass {
  string guid = 1;
  uint32 guid_hash_crc = 2;
  string class_name = 3;
  string display_name = 4;
  string item_type = 5;
  string item_sub_type = 6;
  uint64 occupancy_micro_scu = 7;
  uint64 capacity_micro_scu = 8;  // of its inventory container, 0 with none or no limit
  bool container = 9;             // it gets an inventory of its own
}

message AdminSearchEntityClassesResponse {
  repeated AdminEntityClass classes = 1;  // by class name
}
// ---- Admin inventories (end) ----

// Answered by sc-entitygraph, which owns entities and the container tree. It shares that service's port, so no GRPCRoute
// may list it.
service EntityGraphInternal {
  // What a DGS governs: the roots and everything under them, down to the roots of other DGSs. NOT_FOUND names the roots
  // the tree lacks, before anything is sent. A container is sent once, parents before children, in chunks.
  rpc LoadArea(LoadAreaRequest) returns (stream LoadAreaResponse);
  // Who owns these entities, for sc-entity-subscription.
  rpc GetOwners(GetOwnersRequest) returns (GetOwnersResponse);
  // ---- Admin inventories (begin) ----
  // Every inventory of a player: its own (personal, location, hangar, ...), the containers of the entities it owns (a
  // ship's holds, crates, backpacks), and every container nested in those, with the items of each.
  rpc AdminInventoryTree(AdminInventoryTreeRequest) returns (AdminInventoryTreeResponse);
  rpc AdminMoveItem(AdminMoveItemRequest) returns (AdminMoveItemResponse);
  // A new item of a seeded class, with a GEID sc-entitygraph allocates, stowed in the inventory. A container class
  // gets its inventory with it.
  rpc AdminAddItem(AdminAddItemRequest) returns (AdminAddItemResponse);
  // Erases a stowed item and everything it holds.
  rpc AdminRemoveItem(AdminRemoveItemRequest) returns (AdminRemoveItemResponse);
  // The seeded entity classes, for picking what to add.
  rpc AdminSearchEntityClasses(AdminSearchEntityClassesRequest) returns (AdminSearchEntityClassesResponse);
  // ---- Admin inventories (end) ----
  // ---- Game data seed (begin). Sent by sc-seeder and sc-admin seed, once per region. ----
  // The entity classes of a game build, replaced by GUID. Classes the build no longer has are kept, as items may still
  // be of them. Messages of at most 4 MiB; the answer counts the classes written.
  rpc SeedEntityClasses(stream SeedEntityClassesRequest) returns (SeedResponse);
  // The whole object container tree of a game build. Written once the stream ends, which leaves exactly these nodes and
  // their edges to the parents: a node the build no longer has goes. INVALID_ARGUMENT for an empty tree, a GEID sent
  // twice or a parent that is not in it, before anything is written. The answer counts the nodes.
  rpc SeedContainers(stream SeedContainersRequest) returns (SeedResponse);
  // ---- Game data seed (end) ----
}

// ---- Game data seed of sc-entitygraph (begin). Read from the game archive, see docs/DATA.md. ----
message EntityClassInventory {
  int64 capacity_micro_scu = 1;
  bool closed = 2;
}

// A localization token and its English text, empty when the game has none.
message LocalizedText {
  string token = 1;
  string en = 2;
}

message EntityClassSeed {
  string guid = 1;
  uint32 guid_hash_crc = 2;
  string class_name = 3;
  string item_type = 4;
  string item_sub_type = 5;
  LocalizedText name = 6;
  LocalizedText description = 7;
  optional int64 occupancy_micro_scu = 8;  // absent when the class has no inventory occupancy
  EntityClassInventory inventory = 9;      // absent when the class holds no inventory
}

message SeedEntityClassesRequest {
  repeated EntityClassSeed classes = 1;
}

// A node of the object container tree; see docs/DATA.md, Object container tree, for each field.
message ContainerSeed {
  uint64 geid = 1;
  optional uint64 parent = 2;  // absent on the universe root
  string guid = 3;
  repeated uint32 labels = 4;
  uint32 socpak_content_hash = 5;
  uint32 socpak_file_path_hash = 6;
  uint64 start_id = 7;
  bool has_planet = 8;
  uint32 streaming_immovable_count = 9;
  uint32 streaming_movable_count = 10;
  string name = 11;
  string system = 12;
}

message SeedContainersRequest {
  repeated ContainerSeed containers = 1;
}
// ---- Game data seed of sc-entitygraph (end) ----

message GetAccountsRequest {
  repeated uint64 geids = 1;
}

message PlayerAccount {
  uint64 geid = 1;
  uint32 account_id = 2;
}

message GetAccountsResponse {
  // One for each known geid, in no set order. Unknown geids are left out.
  repeated PlayerAccount accounts = 1;
}

// ---- Portal and admin: web accounts in sc-identity (begin). Asked by sc-portal, sc-admin-web and sc-admin. ----
// Errors are gRPC codes: INVALID_ARGUMENT carries a message fit to show the user, UNAUTHENTICATED is the one answer to
// every failed login, ALREADY_EXISTS the one answer to a taken handle or email, RESOURCE_EXHAUSTED a rate limit.

// Where a web request came from, for the audit and the rate limits.
message WebClient {
  string ip = 1;
  string user_agent = 2;
}

message RegisterAccountRequest {
  string handle = 1;
  string email = 2;
  string password = 3;
  WebClient client = 4;
}

message RegisterAccountResponse {
  uint32 account_id = 1;
  string handle = 2;
}

message PasswordLoginRequest {
  // A handle or an email.
  string login = 1;
  string password = 2;
  WebClient client = 3;
}

message PasswordLoginResponse {
  // The `sc_session` cookie's value. Only its hash is stored.
  string session_token = 1;
  uint32 account_id = 2;
  string handle = 3;
  repeated string roles = 4;
  int64 expires_at = 5;  // Unix ms
}

message VerifyWebSessionRequest {
  string token = 1;
}

message VerifyWebSessionResponse {
  bool valid = 1;
  uint32 account_id = 2;
  string handle = 3;
  repeated string roles = 4;
}

message RevokeWebSessionRequest {
  // Logout: the session with this token.
  string token = 1;
  // Or the session `session_id` of `account_id`, from ListWebSessions.
  uint32 account_id = 2;
  string session_id = 3;
}

message RevokeWebSessionResponse {
  bool revoked = 1;
}

message ListWebSessionsRequest {
  uint32 account_id = 1;
  // Marks the caller's own session in the answer.
  string current_token = 2;
}

message WebSession {
  string session_id = 1;
  int64 created_at = 2;    // Unix ms
  int64 last_seen_at = 3;  // Unix ms
  int64 expires_at = 4;    // Unix ms
  string ip = 5;
  string user_agent = 6;
  bool current = 7;
}

message ListWebSessionsResponse {
  // Live sessions, newest first.
  repeated WebSession sessions = 1;
}

message ChangePasswordRequest {
  uint32 account_id = 1;
  string current_password = 2;
  string new_password = 3;
  // This session stays; every other session of the account is revoked.
  string keep_session_token = 4;
  WebClient client = 5;
}

message ChangePasswordResponse {}

message IssueGameTokenRequest {
  uint32 account_id = 1;
}

// What LoginData.json carries for the game.
message IssueGameTokenResponse {
  string token = 1;
  string handle = 2;
  int64 expires_at = 3;  // Unix ms
}

message GetAccountRequest {
  uint32 account_id = 1;
}

message AccountSummary {
  uint32 account_id = 1;
  string handle = 2;
  string email = 3;
  repeated string roles = 4;
  int64 created_at = 5;  // Unix ms
  bool disabled = 6;
  uint64 geid = 7;  // the account's player
}

message GetAccountResponse {
  AccountSummary account = 1;
}

message SearchAccountsRequest {
  // Part of a handle or an email, case ignored, or an account id. Empty lists every account.
  string query = 1;
  uint32 limit = 2;  // 50 when 0, at most 200
  string page_token = 3;
}

message SearchAccountsResponse {
  // By account id.
  repeated AccountSummary accounts = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message SetAccountStateRequest {
  uint32 account_id = 1;
  // Disabling revokes the account's web sessions.
  optional bool disabled = 2;
  // Replaces the roles when `set_roles`. Known roles: `admin`.
  repeated string roles = 3;
  bool set_roles = 4;
  // An admin's password reset. Revokes the account's web sessions.
  optional string new_password = 5;
}

message SetAccountStateResponse {
  AccountSummary account = 1;
}
// ---- Portal and admin (end) ----

// Answered by sc-identity, which owns accounts. It shares that service's port, so no GRPCRoute may list it.
service IdentityInternal {
  rpc GetAccounts(GetAccountsRequest) returns (GetAccountsResponse);
  // ---- Portal and admin (begin) ----
  rpc RegisterAccount(RegisterAccountRequest) returns (RegisterAccountResponse);
  rpc PasswordLogin(PasswordLoginRequest) returns (PasswordLoginResponse);
  rpc VerifyWebSession(VerifyWebSessionRequest) returns (VerifyWebSessionResponse);
  rpc RevokeWebSession(RevokeWebSessionRequest) returns (RevokeWebSessionResponse);
  rpc ListWebSessions(ListWebSessionsRequest) returns (ListWebSessionsResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc IssueGameToken(IssueGameTokenRequest) returns (IssueGameTokenResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc SearchAccounts(SearchAccountsRequest) returns (SearchAccountsResponse);
  rpc SetAccountState(SetAccountStateRequest) returns (SetAccountStateResponse);
  // ---- Portal and admin (end) ----
}

message GetPlayerShardRequest {
  uint64 geid = 1;
}

// The shard the Hub last sent a player to, while its Hub connection lasts.
message PlayerShard {
  string shard_id = 1;
  string public_address = 2;
  uint32 public_port = 3;
  uint64 location_id = 4;
  // Players on this shard at the same location, the player included.
  uint32 players_at_location = 5;
  // Players on this shard.
  uint32 players_on_shard = 6;
}

message GetPlayerShardResponse {
  // Unset for a player on no shard.
  PlayerShard shard = 1;
}

// Answered by sc-hub, which records the shard of each joining player. The Hub's own port speaks its TLS protocol, so this
// is on a port of its own, behind the ClusterIP Service `sc-hub-internal`.
service HubInternal {
  rpc GetPlayerShard(GetPlayerShardRequest) returns (GetPlayerShardResponse);
}

// Commerce. sc-eatransaction orchestrates a purchase by calling the services that own its data: the ledger charges, the
// entitlement service grants, the rental service records the rental and the shop prices it. Each of these services
// shares its owner's port, so no GRPCRoute may list it.

import "sc/external/services/entitlement/v2/types.proto";
import "sc/external/services/solar_system_shop/v1/types.proto";

message LedgerDebitRequest {
  // Idempotency key. Repeating it returns the first result and charges nothing more.
  string key = 1;
  uint64 owner_geid = 2;
  uint32 account_id = 3;  // opens the ledger on first use
  string ledger_name = 4;
  int64 amount = 5;  // more than 0
}

message LedgerDebitResponse {
  uint64 version = 1;  // the ledger's version once charged
  bool replayed = 2;  // the key had been charged before
}

message LedgerRefundRequest {
  string key = 1;  // the debit's key
  uint64 owner_geid = 2;
}

message LedgerRefundResponse {
  // False when nothing was charged under the key. The key is then spent, so a late debit with it is refused.
  bool refunded = 1;
  int64 amount = 2;
  uint64 version = 3;
}

message LedgerBalancesRequest {
  uint64 owner_geid = 1;
}

message LedgerBalance {
  string ledger_name = 1;
  int64 amount = 2;
  int32 currency = 3;  // sc.external.services.ledger.v1.Currency
  uint64 version = 4;
  int64 updated_at_ms = 5;
}

message LedgerBalancesResponse {
  // The ledgers the player has opened. A player who never asked for funds has none yet.
  repeated LedgerBalance balances = 1;
}

message LedgerAdjustRequest {
  // Idempotency key. Repeating it returns the first result and changes nothing more.
  string key = 1;
  uint64 owner_geid = 2;
  uint32 account_id = 3;  // opens the ledger on first use
  string ledger_name = 4;
  int64 delta = 5;  // not 0. Negative takes money, and is refused when the balance would go below 0
  string reason = 6;
  string actor = 7;  // who asked, for the record
}

message LedgerAdjustResponse {
  int64 balance_before = 1;
  int64 balance_after = 2;
  uint64 version = 3;
  bool replayed = 4;
}

message LedgerOperationsRequest {
  uint64 owner_geid = 1;
  uint32 limit = 2;  // 0 for 50, at most 500
  int64 before_ms = 3;  // 0 for the newest; otherwise those created before this time
}

message LedgerOperation {
  string key = 1;
  string ledger_name = 2;
  int64 amount = 3;  // as recorded: a debit's charge, an adjustment's delta
  string state = 4;  // debited, refunded, cancelled or adjusted
  int64 change = 5;  // what it did to the balance now
  uint64 version = 6;
  string reason = 7;
  string actor = 8;
  int64 created_at_ms = 9;
  int64 updated_at_ms = 10;
  optional int64 balance_before = 11;  // recorded for adjustments
  optional int64 balance_after = 12;
}

message LedgerOperationsResponse {
  // Newest first.
  repeated LedgerOperation operations = 1;
}

// Answered by sc-ledger, which owns `ledgers`.
service LedgerInternal {
  // FAILED_PRECONDITION for insufficient funds, which records nothing, or for a key already refunded.
  rpc Debit(LedgerDebitRequest) returns (LedgerDebitResponse);
  // Gives back what a debit took. Safe to repeat, and to call when it is unknown whether the debit happened.
  rpc Refund(LedgerRefundRequest) returns (LedgerRefundResponse);
  // For the admin site. Reads only: opens no ledger.
  rpc Balances(LedgerBalancesRequest) returns (LedgerBalancesResponse);
  // A keyed credit or debit by an admin. FAILED_PRECONDITION for insufficient funds or a key used for something else.
  rpc Adjust(LedgerAdjustRequest) returns (LedgerAdjustResponse);
  // The keyed operations of a player: purchases, refunds and adjustments.
  rpc Operations(LedgerOperationsRequest) returns (LedgerOperationsResponse);
}

message GrantPurchaseRequest {
  // Idempotency key. The URN is derived from it and the player, so repeating it grants nothing more.
  string key = 1;
  uint32 account_id = 2;
  uint64 player_id = 3;
  sc.external.services.entitlement.v2.EntitlementSourceType source_type = 4;
  string entity_class_guid = 5;
  int64 rental_expiry_ms = 6;  // 0 for none
  string log_message = 7;
}

message GrantPurchaseResponse {
  string urn = 1;
}

message SetRentalExpiryRequest {
  string urn = 1;
  uint64 player_id = 2;
  int64 rental_expiry_ms = 3;  // absolute, so a repeat changes nothing
  // Undoes the revocation of an ended rental, so the entity is made again.
  bool reactivate = 4;
  string log_message = 5;
  string command_id = 6;
}

message SetRentalExpiryResponse {}

message RevokeExpiredRentalsRequest {
  repeated string urns = 1;
}

message RevokeExpiredRentalsResponse {
  // Those revoked by this call. An entitlement whose expiry has moved on is left alone.
  repeated string revoked = 1;
}

message QueryEntitlementsRequest {
  uint32 account_id = 1;  // for the starter grant on first sight
  uint64 player_id = 2;
  sc.external.services.entitlement.v2.EntitlementFilter filter = 3;
  bool include_persistent_properties = 4;
}

message QueryEntitlementsResponse {
  repeated sc.external.services.entitlement.v2.Entitlement entitlements = 1;
}

message UpdateLoadoutRequest {
  uint64 player_id = 1;
  string urn = 2;
  bytes loadout = 3;  // an ItemPortLoadout, which v1 and v2 encode alike
  string command_id = 4;
}

message UpdateLoadoutResponse {}

message StarterEntitlement {
  string class_guid = 1;
  string item_type = 2;
  string item_sub_type = 3;
  string name = 4;
  string source = 5;
  string port_path = 6;
}

message SeedStarterEntitlementsRequest {
  repeated StarterEntitlement entitlements = 1;
}

// Answered by every seed RPC. A seed replaces rows by key, so repeating it changes nothing.
message SeedResponse {
  uint64 rows = 1;
}

message RevokeEntitlementRequest {
  string urn = 1;
  uint64 player_id = 2;
  string log_message = 3;
  string command_id = 4;
}

message RevokeEntitlementResponse {
  int32 previous_status = 1;  // sc.external.services.entitlement.v2.EntitlementStatus
  bool revoked = 2;  // false when it already was, so a repeat changes nothing
}

message EntitlementHistoryRequest {
  uint64 player_id = 1;
  string urn = 2;  // empty for all of the player's
  uint32 limit = 3;  // 0 for 50, at most 500
}

message EntitlementHistoryEntry {
  string urn = 1;
  int32 log_action = 2;  // sc.external.services.entitlement.v2.EntitlementLogAction
  string log_message = 3;
  string command_id = 4;
  int64 created_at_ms = 5;
}

message EntitlementHistoryResponse {
  // Newest first.
  repeated EntitlementHistoryEntry entries = 1;
}

// Answered by sc-entitlement (v1), which owns `entitlements`, `entitlement_history` and `starter_entitlements`.
service EntitlementInternal {
  rpc GrantPurchase(GrantPurchaseRequest) returns (GrantPurchaseResponse);
  // NOT_FOUND for an entitlement the player does not have.
  rpc SetRentalExpiry(SetRentalExpiryRequest) returns (SetRentalExpiryResponse);
  rpc RevokeExpiredRentals(RevokeExpiredRentalsRequest) returns (RevokeExpiredRentalsResponse);
  // For sc-entitlement-v2, in batches.
  rpc QueryEntitlements(QueryEntitlementsRequest) returns (stream QueryEntitlementsResponse);
  // NOT_FOUND for an entitlement the player does not have.
  rpc UpdateLoadout(UpdateLoadoutRequest) returns (UpdateLoadoutResponse);
  rpc SeedStarterEntitlements(SeedStarterEntitlementsRequest) returns (SeedResponse);
  // For the admin site. NOT_FOUND for an entitlement the player does not have.
  rpc RevokeEntitlement(RevokeEntitlementRequest) returns (RevokeEntitlementResponse);
  rpc EntitlementHistory(EntitlementHistoryRequest) returns (EntitlementHistoryResponse);
}

message CreateRentalRequest {
  string id = 1;  // a repeat with the same id creates nothing more
  uint32 account_id = 2;
  uint64 player_id = 3;
  string entitlement_urn = 4;
  string entity_class_guid = 5;
  uint32 days = 6;
  int64 expire_at_ms = 7;
  string log_message = 8;
}

message CreateRentalResponse {}

message ExtendRentalRequest {
  // Idempotency key. Repeating it returns the first expiry and extends nothing more.
  string key = 1;
  string id = 2;
  uint64 player_id = 3;
  uint32 days = 4;
  string log_message = 5;
}

message ExtendRentalResponse {
  int64 expire_at_ms = 1;
  string entitlement_urn = 2;
}

message GetRentalRequest {
  string id = 1;
  uint64 player_id = 2;
}

message GetRentalResponse {
  string entity_class_guid = 1;
  string entitlement_urn = 2;
}

import "sc/external/services/rental/v1/types.proto";

message ListRentalsRequest {
  uint64 player_id = 1;
  bool include_finished = 2;
}

message ListRentalsResponse {
  // Newest first.
  repeated sc.external.services.rental.v1.Rental rentals = 1;
}

message EndRentalRequest {
  string id = 1;
  uint64 player_id = 2;
  string log_message = 3;
}

message EndRentalResponse {
  bool ended = 1;  // false when it had already ended, so a repeat changes nothing
  int64 previous_expire_at_ms = 2;
}

// Answered by sc-rental, which owns `rentals` and `rental_history`.
service RentalInternal {
  rpc CreateRental(CreateRentalRequest) returns (CreateRentalResponse);
  // NOT_FOUND for a rental the player does not have.
  rpc ExtendRental(ExtendRentalRequest) returns (ExtendRentalResponse);
  // NOT_FOUND for a rental the player does not have.
  rpc GetRental(GetRentalRequest) returns (GetRentalResponse);
  // For the admin site.
  rpc ListRentals(ListRentalsRequest) returns (ListRentalsResponse);
  // Makes an active rental expire now, then ends it as an expiry: the entitlement is revoked first. NOT_FOUND for a
  // rental the player does not have.
  rpc EndRental(EndRentalRequest) returns (EndRentalResponse);
}

import "sc/external/services/entity_document/v1/documents.proto";

message GetEntityDocumentsRequest {
  uint64 entity_id = 1;
  repeated string classes = 2;  // field names of EntityDocumentBody's oneof, such as player_home_location; empty for all
}

message StoredEntityDocument {
  string class = 1;
  sc.external.services.entity_document.v1.EntityDocument document = 2;
  uint64 owner_id = 3;
  bool prepared = 4;  // a Prepare waits for its Commit
}

message GetEntityDocumentsResponse {
  repeated StoredEntityDocument documents = 1;
}

message PutEntityDocumentRequest {
  uint64 entity_id = 1;
  uint64 owner_id = 2;
  sc.external.services.entity_document.v1.EntityDocumentBody body = 3;
  // Unset to write whatever is there; 0 when there must be none; otherwise the revision there must be. A mismatch is
  // ABORTED, and nothing is written.
  optional uint64 expected_revision = 4;
}

message PutEntityDocumentResponse {
  sc.external.services.entity_document.v1.EntityDocument previous = 1;  // unset when there was none
  uint64 revision = 2;
}

// Answered by sc-entity-document, which owns `entity_documents`, for the admin site. A document is written whole, so a
// repeat changes nothing but the revision.
service EntityDocumentInternal {
  rpc GetDocuments(GetEntityDocumentsRequest) returns (GetEntityDocumentsResponse);
  rpc PutDocument(PutEntityDocumentRequest) returns (PutEntityDocumentResponse);
}

message RentalPrice {
  string id = 1;  // entity class GUID
  repeated sc.external.services.solar_system_shop.v1.RentalOffering offerings = 2;
}

message SeedRentalPricesRequest {
  repeated RentalPrice prices = 1;
}

// Answered by sc-solar-system-shop, which owns `shop_inventory`. sc-admin supplies the rental price list here.
service SolarSystemShopInternal {
  rpc SeedRentalPrices(SeedRentalPricesRequest) returns (SeedResponse);
}

// Game data. sc-admin reads it from the archive and hands it to the service that owns its table.

message ReputationScope {
  string scope = 1;
  string standings_id = 2;
  string display_name = 3;
  string description = 4;
  int32 initial_reputation = 5;
  int32 ceiling = 6;
}

message ReputationStanding {
  string id = 1;
  string standings_id = 2;
  string name = 3;
  string description = 4;
  int32 min = 5;
  int64 drift_seconds = 6;
  int32 drift_amount = 7;
  bool gated = 8;
}

message ReputationLadderStanding {
  string standings_id = 1;
  string standing_id = 2;
}

message SeedReputationRequest {
  repeated ReputationScope scopes = 1;
  repeated ReputationStanding standings = 2;
  repeated ReputationLadderStanding ladder = 3;
}

// Answered by sc-reputation, which owns `reputation_scopes`, `reputation_standings` and `reputation_ladder_standings`.
service ReputationInternal {
  rpc SeedReputation(SeedReputationRequest) returns (SeedResponse);
}

message BlueprintDefault {
  string blueprint_id = 1;
  string category_id = 2;
  string item_class_id = 3;
  int32 process_type = 4;
}

message SeedBlueprintDefaultsRequest {
  repeated BlueprintDefault blueprints = 1;
}

// Answered by sc-blueprint-library, which owns `blueprint_defaults`.
service BlueprintLibraryInternal {
  rpc SeedBlueprintDefaults(SeedBlueprintDefaultsRequest) returns (SeedResponse);
}

message ScenarioSeed {
  string template_id = 1;
  int32 status = 2;  // a ScenarioStatus
}

message SeedScenariosRequest {
  repeated ScenarioSeed scenarios = 1;
}

// Answered by sc-mission-scenario, which owns `scenarios`. Only adds, as an operator may have started one.
service MissionScenarioInternal {
  rpc SeedScenarios(SeedScenariosRequest) returns (SeedResponse);
}

message MissionContractSeed {
  string id = 1;
  bytes body = 2;  // a MissionContract
}

message SeedMissionContractsRequest {
  repeated MissionContractSeed contracts = 1;
}

// Answered by sc-contract-broker, which owns `mission_contracts`.
service ContractBrokerInternal {
  rpc SeedMissionContracts(SeedMissionContractsRequest) returns (SeedResponse);
}

import "sc/external/services/social/v1/types.proto";
import "sc/external/services/presence/v1/types.proto";

// A member of a group, with what a service needs to reach it through push.
message GroupMemberAccount {
  uint64 geid = 1;
  uint32 account_id = 2;
  string name = 3;
}

// A group as sc-social keeps it: what the client sees, and its members in the order they joined.
message InternalGroup {
  sc.external.services.social.v1.Group group = 1;
  repeated GroupMemberAccount members = 2;
}

message GetGroupsRequest {
  repeated string group_ids = 1;
}

// In the order asked. Ids of no group are left out.
message GetGroupsResponse {
  repeated InternalGroup groups = 1;
}

message ListGroupIdsRequest {
  uint64 geid = 1;
  // `sc.external.services.social.v1.GroupType` values. Empty means every type.
  repeated int32 types = 2;
}

// Oldest membership first.
message ListGroupIdsResponse {
  repeated string group_ids = 1;
}

message GetTeamsRequest {
  string group_id = 1;
}

// The first member of `member_geids` leads, unless the type has no leader. A type that allows one group per player
// takes each member out of its other group of that type.
message CreateGroupRequest {
  int32 type = 1;
  string name = 2;
  string parent_urn = 3;
  repeated uint64 member_geids = 4;
}

message CreateGroupResponse {
  InternalGroup group = 1;
}

// Adds a player to a group, and to the emptiest of its teams if it has teams.
message JoinGroupRequest {
  string group_id = 1;
  uint64 geid = 2;
}

message JoinGroupResponse {}

// Moves a member of a group into another team of that group.
message MoveToTeamRequest {
  string team_id = 1;
  uint64 geid = 2;
}

message MoveToTeamResponse {
  // The group the team belongs to, after the move.
  InternalGroup group = 1;
  // Equal to the team asked for when the player was already in it, and nothing moved.
  string previous_team_id = 2;
}

// Gives a group this many teams, named "Team <n>". Members of a team that goes move to the first one.
message SyncTeamsRequest {
  string group_id = 1;
  uint32 count = 2;
  int32 team_type = 3;
}

message SyncTeamsResponse {}

message DestroyGroupRequest {
  string group_id = 1;
}

message DestroyGroupResponse {}

// Answered by sc-social, which owns groups, members and invitations (`social_*`). It shares that service's port, so no
// GRPCRoute may list it. The chat, squad, custom lobby, RTC and presence services ask it about groups. A destroyed
// group's rows in the other services go through `GroupDataInternal`.
service SocialInternal {
  rpc GetGroups(GetGroupsRequest) returns (GetGroupsResponse);
  rpc ListGroupIds(ListGroupIdsRequest) returns (ListGroupIdsResponse);
  // The teams of a group, oldest first.
  rpc GetTeams(GetTeamsRequest) returns (GetGroupsResponse);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  // ALREADY_EXISTS for a member, FAILED_PRECONDITION for a full group.
  rpc JoinGroup(JoinGroupRequest) returns (JoinGroupResponse);
  rpc MoveToTeam(MoveToTeamRequest) returns (MoveToTeamResponse);
  rpc SyncTeams(SyncTeamsRequest) returns (SyncTeamsResponse);
  // Ends a group and its teams. Their rows in other services follow.
  rpc DestroyGroup(DestroyGroupRequest) returns (DestroyGroupResponse);
}

message DeleteGroupDataRequest {
  repeated string group_ids = 1;
}

message DeleteGroupDataResponse {
  uint64 deleted = 1;
}

// Answered by each service that keeps rows per group: sc-chat (`chat_messages`), sc-squad (`squads`), sc-custom-lobby
// (`custom_lobbies`) and sc-rtc (`rtc_channels`, `rtc_calls`), each on its own port. sc-social calls them for the
// groups it destroyed, until each has answered, so calling it again is harmless.
service GroupDataInternal {
  rpc DeleteGroupData(DeleteGroupDataRequest) returns (DeleteGroupDataResponse);
}

message GetPresencesRequest {
  repeated uint32 account_ids = 1;
}

message PlayerPresence {
  uint32 account_id = 1;
  // As anyone but the player sees it: invisible or stale is offline, without activity.
  sc.external.services.presence.v1.Presence presence = 2;
  // What the client reported as its environment. Empty while offline.
  string environment = 3;
}

// Accounts that were never online are left out.
message GetPresencesResponse {
  repeated PlayerPresence presences = 1;
}

// Answered by sc-presence, which owns `player_presence`. It shares that service's port, so no GRPCRoute may list it.
service PresenceInternal {
  rpc GetPresences(GetPresencesRequest) returns (GetPresencesResponse);
}

message IsBlockedRequest {
  // Whether `owner_account_id` blocked `target_account_id`.
  uint32 owner_account_id = 1;
  uint32 target_account_id = 2;
}

message IsBlockedResponse {
  bool blocked = 1;
}

message ListFriendsRequest {
  uint32 account_id = 1;
}

// Oldest friendship first.
message ListFriendsResponse {
  repeated uint32 account_ids = 1;
}

// Answered by sc-contacts, which owns relationships, friend requests and notes (`contact_*`). It shares that service's
// port, so no GRPCRoute may list it. sc-friends goes through the public ContactsService with its caller's token.
service ContactsInternal {
  rpc IsBlocked(IsBlockedRequest) returns (IsBlockedResponse);
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);
}

message GetGameFileRequest {
  // The game build, its change number, e.g. "12913470".
  string build = 1;
  // As in the build's manifest.json, e.g. "collision/1200814982.col". Relative, without `..`.
  string path = 2;
}

message GameFileChunk {
  bytes data = 1;
  // The file's size in bytes, in the first chunk only.
  uint64 size = 2;
}

message ListGameBuildsRequest {}

message GameBuildStatus {
  string build = 1;
  // Pulled, checked and served.
  bool ready = 2;
  // The files of its manifest, once ready.
  uint64 file_count = 3;
}

message ListGameBuildsResponse {
  // The builds the service was given, in that order.
  repeated GameBuildStatus builds = 1;
}

// Answered by sc-gamedata, a region's cache of game data. Each replica pulls the builds it is given from the registry
// (image `scbackend/gamedata:<build>`, files under `/gamedata/<build>/`) onto its own volume and serves them from there.
// gRPC health reports "" SERVING once every build is there.
service GameData {
  // A file of a ready build, in chunks of about 1 MiB. NOT_FOUND for a build or path it does not have, UNAVAILABLE for a
  // build it was given but has not pulled yet, INVALID_ARGUMENT for an absolute path or one with `..`.
  rpc GetFile(GetGameFileRequest) returns (stream GameFileChunk);
  rpc ListBuilds(ListGameBuildsRequest) returns (ListGameBuildsResponse);
}
