// Hub messages with required fields, hand-written for 4.10.2 (CL 12913470).
//
// This file is proto2 because a message missing a required field fails to parse in the client with
// no log line. proto3 cannot express that, since it never writes a zero value.
syntax = "proto2";
package scbackend.hub;

// Frame payload. The client demands all three fields, and drops the frame otherwise. Replies normally use id 0, so a frame that
// left id out would never reach any handler.
message Envelope {
  required string key = 1;
  required bytes payload = 2;
  required uint64 id = 3;
}

// No field is required at this level.
// Field 1 and fields 8-12 are nested messages that the login path does not read, so they are left out.
message AccountRecord {
  optional string session = 2;  // given to the session manager
  optional int32 account_id = 3;
  optional string display_name = 4;
  optional string handle = 5;  // logged as "User Login Success - Handle[...]"
  optional string field6 = 6;
  optional string field7 = 7;
  optional uint64 geid = 13;
}

// `account_login_response`.
message AccountLoginResponse {
  required int32 result = 1;  // 1 = success
  optional AccountRecord account = 2;
  optional int32 field4 = 4;
  // Positive makes the client wait for login_queue_status; zero completes.
  required int32 queue_wait = 5;
  required int32 field6 = 6;
}

// Both halves are required.
message RpcGuid {
  required uint64 high = 1;
  required uint64 low = 2;
}

// `diff.rpc.request`, as the client sends it. Field 5 counts up from 10000.
message RpcRequest {
  optional string method = 1;
  optional string body = 2;  // JSON
  optional uint64 call_id = 5;
  optional RpcGuid source = 6;
}

// `diff.rpc.response`.
// The client demands all five fields. The client finds the pending call by `call_id`.
message RpcResponse {
  required string body = 1;
  required uint64 call_id = 2;
  required int32 code = 3;  // 0 = success
  required string message = 4;
  required RpcGuid destination = 5;
}

// `cmsg_ag_update_plr_status`, the arena-group player status; the client's join-instance handler sends 4 when no
// callback is installed (`08 04`, right after `smsg_do_join_instance`).
message PlayerStatusRequest {
  optional int32 status = 1;
}

// A nested pair of strings inside `PlayerUpdated`; both empty (`0a 00 12 00`).
message PlayerUpdatedGroup {
  optional string first = 1;
  optional string second = 2;
}

// `smsg_ag_plr_updated`, sent at the join:
// `0a 0f <handle> 12 0e <name> 18 00 20 04 28 67 32 04 0a 00 12 00 38 00`. Field 4 echoes the status the client sent; field 5 is
// 0x67 (103), meaning unknown; field 3 and 7 are 0. The zeros are written, so every field is optional (proto2 presence).
message PlayerUpdated {
  optional string handle = 1;
  optional string name = 2;
  optional int32 field3 = 3;
  optional int32 status = 4;
  optional int32 field5 = 5;
  optional PlayerUpdatedGroup group = 6;
  optional int32 field7 = 7;
}

// `msg_sys_notify`, sent at a join: field 2 is a code (2, 27, 3,
// 4 in the order of the join), field 1 is 1 in all, the last one (code 4) carries the instance's address, port, location and shard,
// the others the shard name (field 7). Field 5 is 1 with code 27 and the port with code 4.
message SysNotify {
  optional int32 field1 = 1;
  optional int32 code = 2;
  optional string address = 4;
  optional int32 field5 = 5;
  optional uint64 location = 6;
  optional string shard = 7;
}
