[package]
name = "sc-admin"
version = "0.1.0"
edition = "2021"
description = "Prepares backend state: CA, certificates, accounts, destinations, client files and game content"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
p4k-formats = { path = "../../../P4kTools/crates/formats" }
p4k = { path = "../../../P4kTools/crates/p4k" }
prost = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
sc-seed = { path = "../../crates/sc-seed" }
sc-proto = { path = "../../crates/sc-proto" }
sc-runtime = { path = "../../crates/sc-runtime" }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "router", "server"] }

[workspace]

[profile.release]
lto = "thin"
panic = "abort"
strip = true
