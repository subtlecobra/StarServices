[package]
name = "sc-dgs"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sc-dgs"
path = "src/main.rs"

[features]
# The tables in `testdata/`, which scripts/game-files.sh generates from the game, for the tests of crates that run a DGS
# in process (sc-pu-frontend). Read at run time, never compiled in, and never in an image: a release build gets its
# tables from sc-gamedata.
fixtures = []

[dependencies]
clap.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
parry3d = "0.31"
sc-proto.workspace = true
sc-runtime.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
