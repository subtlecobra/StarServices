[package]
name = "sc-seeder"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
k8s-openapi = { version = "0.29", features = ["v1_35"] }
kube = { version = "5", default-features = false, features = ["client", "ring", "rustls-tls"] }
rustls.workspace = true
sc-oci.workspace = true
sc-seed.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json.workspace = true
sc-proto.workspace = true
tokio = { workspace = true, features = ["fs"] }
sc-seed = { workspace = true, features = ["fakes"] }
