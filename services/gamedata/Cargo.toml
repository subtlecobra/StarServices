[package]
name = "sc-gamedata"
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
redis = { version = "1", default-features = false, features = ["cluster-async", "connection-manager", "tokio-comp"] }
sc-oci.workspace = true
sc-api.workspace = true
sc-proto.workspace = true
sc-runtime.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11"
tokio = { workspace = true, features = ["fs"] }
tokio-stream.workspace = true
tonic.workspace = true
tonic-health = "0.14"
tracing.workspace = true

[dev-dependencies]
bytes.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util.workspace = true
http-body-util = "0.1"
http.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["http1"] }
tar = { version = "0.4", default-features = false }
tokio-stream = { workspace = true, features = ["net"] }
