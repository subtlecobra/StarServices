[package]
name = "sc-pu-frontend"
version = "0.4.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
blake2 = "0.10"
clap.workspace = true
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "std"] }
num-bigint = "0.4"
num-traits = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
sc-api.workspace = true
sc-proto.workspace = true
sc-runtime.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true

# A real DGS for the tests of the join. The binary does not link it.
[dev-dependencies]
sc-dgs = { path = "../dgs", features = ["fixtures"] }
