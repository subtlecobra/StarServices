# A node of a ShardRegion's Valkey cluster, which holds the region's game data for sc-gamedata. The shard operator
# appends maxmemory, from the region's spec.gamedata.cache.memory.
port 6379
bind * -::*
# Only sc-gamedata and the cluster's own pods reach it: the region's NetworkPolicy says so.
protected-mode no
dir /data
cluster-enabled yes
cluster-config-file /data/nodes.conf
cluster-node-timeout 5000
# Clients follow hostnames (the pods' names in the headless Service), which outlive a pod's IP.
cluster-preferred-endpoint-type hostname
# Every write goes to the append-only file on the node's volume, so a restarted node loads its share again.
appendonly yes
appendfsync everysec
save ""
# Game data must never be evicted: a full node refuses writes, which fails the load instead.
maxmemory-policy noeviction
