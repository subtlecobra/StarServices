[package]
name = "sc-oci"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Pulls an image of files over the OCI distribution API: sc-gamedata's game builds and sc-seeder's seed bundles"

[dependencies]
bytes.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
http.workspace = true
http-body-util = "0.1"
hyper = { workspace = true, features = ["http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
hyper-util = { workspace = true, features = ["http1"] }
rustls.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
